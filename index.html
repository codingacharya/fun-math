<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fun Math Games</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<style>
:root{--bg:#fff8e7;--card:#ffffff;--text:#2b2b44;--accent:#ff6b6b;--accent2:#4ecdc4;--muted:#e8e1cf;--good:#2ecc71;--bad:#e67e22;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1b2e;--card:#2a2745;--text:#f4f1ff;--muted:#3d3a5c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1b2e;--card:#2a2745;--text:#f4f1ff;--muted:#3d3a5c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Comic Neue","Trebuchet MS",system-ui,sans-serif;font-size:1.1rem}
/* Bootstrap-style helpers (Bootstrap's CDN CSS can't load on hosted pages) */
.container{max-width:760px;margin:0 auto;padding:16px}
.row{display:flex;flex-wrap:wrap;gap:12px}
.col{flex:1 1 0;min-width:120px}
.text-center{text-align:center}
.card{background:var(--card);border-radius:20px;padding:20px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.btn{border:0;border-radius:16px;padding:12px 20px;font:inherit;font-weight:700;color:#fff;cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.94)}
.btn-lg{font-size:2.2rem;padding:16px 10px;width:100%}
.btn-primary{background:var(--accent)}
.btn-info{background:var(--accent2);color:#12312f}
.btn-light{background:var(--muted);color:var(--text)}
.btn-light.active{background:var(--accent);color:#fff}
h1{margin:4px 0 12px;font-size:2rem}
.scene{font-size:2.4rem;line-height:1.3;min-height:90px;word-break:break-all}
.big{font-size:2.8rem;font-weight:700}
.group{background:var(--muted);border-radius:16px;padding:12px;cursor:pointer;font-size:2rem;min-height:110px}
.group:hover{outline:3px solid var(--accent2)}
#msg{min-height:2.2rem;font-weight:700;font-size:1.5rem;margin:10px 0}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pop{animation:pop .5s}
@keyframes pop{50%{transform:scale(1.15)}}
.stars{font-size:1.6rem}
</style>
</head>
<body>
<div class="container">
  <h1 class="text-center">🎲 Fun Math Games</h1>
  <div class="row" style="margin-bottom:12px" id="tabs">
    <button class="col btn btn-light active" data-game="count">⭐ Count</button>
    <button class="col btn btn-light" data-game="more">⚖️ More?</button>
    <button class="col btn btn-light" data-game="add">➕ Add</button>
  </div>
  <div class="card text-center" id="board">
    <div class="stars" id="score">Stars: 0</div>
    <p id="question"></p>
    <div id="scene" class="scene"></div>
    <div id="msg"></div>
    <div class="row" id="options"></div>
  </div>
</div>
<script>
$(function(){
  var EMOJI=["🍎","🐶","🚗","⭐","🐟","🎈","🍪","🦖"];
  var game="count", score=0, answer=null, locked=false;
  function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
  function rep(e,n){return new Array(n+1).join(e+" ");}
  function pickOptions(correct){
    var s=[correct];
    while(s.length<3){var x=rnd(Math.max(1,correct-3),correct+3);if(s.indexOf(x)<0&&x>0)s.push(x);}
    return s.sort(function(){return Math.random()-.5;});
  }
  function showNumbers(correct){
    var $o=$("#options").empty();
    $.each(pickOptions(correct),function(_,n){
      $("<div class='col'>").append($("<button class='btn btn-lg btn-info'>").text(n).data("v",n)).appendTo($o);
    });
  }
  function next(){
    locked=false; $("#msg").text("");
    var e=EMOJI[rnd(0,EMOJI.length-1)];
    if(game==="count"){
      answer=rnd(1,10);
      $("#question").text("How many can you count?");
      $("#scene").html(rep(e,answer));
      showNumbers(answer);
    } else if(game==="add"){
      var a=rnd(1,5),b=rnd(1,5); answer=a+b;
      $("#question").text("Let’s add them together!");
      $("#scene").html(rep(e,a)+" <span class='big'>+</span> "+rep(e,b)+" <span class='big'>= ?</span>");
      showNumbers(answer);
    } else {
      var x=rnd(1,9),y=rnd(1,9); while(y===x){y=rnd(1,9);}
      answer=x>y?"L":"R";
      $("#question").text("Tap the group that has MORE!");
      $("#scene").empty();
      $("#options").html(
        "<div class='col'><div class='group' data-v='L'>"+rep(e,x)+"</div></div>"+
        "<div class='col'><div class='group' data-v='R'>"+rep(e,y)+"</div></div>");
    }
  }
  $("#options").on("click","button,.group",function(){
    if(locked)return;
    var v=$(this).data("v");
    if(v===answer){
      locked=true; score++;
      $("#score").text("Stars: "+score+" "+rep("⭐",Math.min(score,10))).addClass("pop");
      setTimeout(function(){$("#score").removeClass("pop");},500);
      $("#msg").text(["Great job! 🎉","Super! 🌟","You did it! 🥳","Awesome! 🚀"][rnd(0,3)]).css("color","var(--good)");
      setTimeout(next,1200);
    } else {
      $("#msg").text("Try again! 💪").css("color","var(--bad)");
      var $b=$(this).addClass("shake");
      setTimeout(function(){$b.removeClass("shake");},400);
    }
  });
  $("#tabs").on("click","button",function(){
    $("#tabs button").removeClass("active"); $(this).addClass("active");
    game=$(this).data("game"); next();
  });
  next();
});
</script>
</body>
</html>
